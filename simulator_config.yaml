paths:
  workload: "workloads/generated_200_16.json"
  platform: "platforms/generated_16.json"
  output: "results/fcfs_smart"

run:
  algorithm: "fcfs_smart"
  overrun_policy: "terminate"
  timeout: 30
  # can be integer epoch, "now", or "YYYY-MM-DD HH:MM:SS"
  start_time: 0

rl:
  enabled: false
  type: "discrete" # "discrete" | "continuous"
  dt: 1800 # required when type == "discrete"
  device: "cpu" # "cpu" | "cuda" | "auto" (explicit "auto" resolves to cuda if available)
  epochs: 10
  num_nodes: 128

  # Keep BOTH agents; pick which one runs via `assign` below
  agents:
    thomas:
      class: "RL_Agent.Thomas.ActorCritic:ActorCritic"
      params:
        obs_dim: 11
        embed_dim: 128
        device: "cpu" # optional; "auto" will resolve; omit to inherit rl.device
      optimizer:
        class: "torch.optim:Adam"
        params:
          lr: 0.0003 # REQUIRED (no silent default)

    spars:
      class: "RL_Agent.SPARS.agent:ActorCriticMLP"
      params:
        obs_dim: 11
        act_dim: 1
        device: "cpu"
      optimizer:
        class: "torch.optim:Adam"
        params:
          lr: 0.0003 # REQUIRED (no silent default)

  # Single-agent assignment — set to "thomas" or "spars"
  assign: "thomas"

logging:
  level: "INFO"
  file: "results/simulation.log"
