paths:
  workload: "workloads/generated_5000_128.json"
  platform: "platforms/generated_32.json"
  output: "results/easy_smart_workshop"

run:
  algorithm: "easy_smart"
  overrun_policy: "terminate"
  timeout: 100
  # can be integer epoch, "now", or "YYYY-MM-DD HH:MM:SS"
  start_time: 0

rl:
  enabled: false
  type: "discrete" # "discrete" | "continuous"
  dt: 500 # required when type == "discrete"
  device: "cuda" # "cpu" | "cuda" | "auto" (explicit "auto" resolves to cuda if available)
  epochs: 50
  num_nodes: 128

  # Keep BOTH agents; pick which one runs via `assign` below
  agents:
    thomas:
      class: "RL_Agent.Thomas.ActorCritic:ActorCritic"
      params:
        obs_dim: 11
        embed_dim: 128
        device: "cuda" # "auto" will resolve; omit to inherit rl.device
      optimizer:
        class: "torch.optim:Adam"
        params:
          lr: 0.0003

    spars:
      class: "RL_Agent.SPARS.agent:ActorCritic"
      params:
        obs_dim: 6
        device: "cuda"
      optimizer:
        class: "torch.optim:Adam"
        params:
          lr: 0.0003

    import: import

  # Single-agent assignment — set to "thomas" or "spars"
  assign: "spars"

logging:
  level: "ERROR"
  file: "results/simulation.log"
