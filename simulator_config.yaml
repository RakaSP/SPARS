paths:
  workload: "workloads/generated_500_8_ws.json"
  platform: "platforms/generated_64.json"
  output: "results/workshop_rl_ws_analysis"

run:
  algorithm: "easy_normal"
  overrun_policy: "terminate"
  timeout: null
  # can be integer epoch, "now", or "YYYY-MM-DD HH:MM:SS"
  start_time: 0

rl:
  enabled: true
  learn: false
  type: "discrete" # "discrete" | "continuous"
  dt: 300 # required when type == "discrete"
  device: "cuda" # "cpu" | "cuda" | "auto" (explicit "auto" resolves to cuda if available)
  epochs: 999999999
  num_nodes: 32
  checkpoint: 'results/workshop_rl_train_4_(normal)/agent_checkpoint.pt'
  # checkpoint: null

  # Keep BOTH agents; pick which one runs via `assign` below
  agents:
    thomas:
      class: "RL_Agent.Thomas.ActorCritic:ActorCritic"
      params:
        obs_dim: 11
        embed_dim: 32
        device: "cuda" # "auto" will resolve; omit to inherit rl.device
      optimizer:
        class: "torch.optim:Adam"
        params:
          lr: 0.0003

    spars:
      class: "RL_Agent.SPARS.agent:ActorCritic"
      params:
        obs_dim: 6
        device: "cuda"
      optimizer:
        class: "torch.optim:Adam"
        params:
          lr: 0.0003

    import: import

  # Single-agent assignment — set to "thomas" or "spars"
  assign: "spars"

logging:
  level: "TRACE"
  file: "results/simulation.log"
